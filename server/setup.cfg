[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
# Neon's pooled connections can lock the test DB during teardown —
# reuse the DB across runs instead of dropping it every time.
addopts = --reuse-db

[isort]
profile = black
known_django = django
default_section = THIRDPARTY
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER

[flake8]
max-line-length = 88
extend-ignore = E203,W503
